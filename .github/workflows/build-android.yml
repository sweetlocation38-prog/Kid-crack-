name: Build Android APK (gratuit, sans EAS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les dépendances du projet
        run: npm install --legacy-peer-deps

      - name: Générer le projet Android natif (expo prebuild)
        run: npx expo prebuild --platform android --non-interactive

      - name: S'assurer que la version "release" utilise la clé de test (pas de vraie signature necessaire)
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle
          echo "--- Verification du fichier build.gradle ---"
          grep -A 3 "buildTypes" android/app/build.gradle || true

      - name: Compiler l'APK complet (avec le code JavaScript embarque)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Mettre l'APK à disposition au téléchargement
        uses: actions/upload-artifact@v5
        with:
          name: kid-crack-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
