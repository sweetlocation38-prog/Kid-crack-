name: Enregistrer un mini-jeu dans Supabase

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le client Supabase
        run: npm install @supabase/supabase-js --no-save

      - name: Lancer le script d'enregistrement
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: node scripts/ensure-boule-qui-roule.js

      - name: Committer le résultat (pour que Claude puisse le lire)
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add scripts/last-run-result.txt
          git commit -m "Résultat de l'enregistrement du mini-jeu" || echo "Rien à committer"
          git push
